<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 2480 3508" role="img" aria-labelledby="title desc">
  <title id="title">Motokah A4 letterhead</title>
  <desc id="desc">A4 Motokah letterhead design for official company letters.</desc>
  <rect width="2480" height="3508" fill="#ffffff"/>
  <rect x="0" y="0" width="2480" height="34" fill="#3493C9"/>
  <rect x="0" y="3474" width="2480" height="34" fill="#3493C9"/>
  <g transform="translate(180 145)">
    <rect x="0" y="0" width="398" height="118" fill="#3493C9"/>
    <text x="42" y="82" font-family="Bebas Neue, Impact, Arial Narrow, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff" letter-spacing="4">MOTOKAH</text>
  </g>
  <g transform="translate(1890 150)" fill="#52677A" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="600">
    <text x="0" y="0">MOTOKAH AFRICA LIMITED</text>
    <text x="0" y="50">Dar es Salaam, Tanzania</text>
    <text x="0" y="100">info@motokah.com</text>
    <text x="0" y="150">www.motokah.com</text>
  </g>
  <line x1="180" y1="385" x2="2300" y2="385" stroke="#E3EDF6" stroke-width="6"/>
  <text x="180" y="720" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#102A43">Date:</text>
  <text x="180" y="950" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800" fill="#102A43">Official Company Letter</text>
  <line x1="180" y1="1040" x2="2300" y2="1040" stroke="#EEF4FA" stroke-width="4"/>
  <g fill="#DCEAF5">
    <rect x="180" y="1240" width="1600" height="16" rx="8"/>
    <rect x="180" y="1320" width="1900" height="16" rx="8"/>
    <rect x="180" y="1400" width="1760" height="16" rx="8"/>
    <rect x="180" y="1600" width="1860" height="16" rx="8"/>
    <rect x="180" y="1680" width="1560" height="16" rx="8"/>
  </g>
  <text x="180" y="3290" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#52677A">Find Your Perfect Ride</text>
  <text x="1850" y="3290" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#52677A">motokah.com</text>
</svg>
