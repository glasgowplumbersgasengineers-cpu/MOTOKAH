name: Update Fuel Prices

"on":
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape current pump prices
        run: node scripts/update-fuel-prices.mjs

      - name: Commit and push
        run: |
          git config user.name "Motokah Fuel Price Bot"
          git config user.email "bot@motokah.com"
          git add src/data/fuelPrices.json
          git diff --cached --quiet || (git commit -m "chore: refresh fuel prices" && git push)
