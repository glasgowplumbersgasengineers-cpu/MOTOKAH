name: iOS Build Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode and print real version evidence
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22  # Capacitor CLI requires Node >=22
          cache: npm

      - run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # This project uses Swift Package Manager for Capacitor plugins
      # (ios/App/CapApp-SPM/Package.swift) — no Podfile/CocoaPods here.
      # xcodebuild resolves SPM packages itself during the build step below.

      # Builds for the iOS Simulator only — no signing certs needed, unlike
      # ios-appstore.yml which does a real signed archive + App Store upload.
      # This just proves the native project actually compiles against the
      # current web build and Capacitor plugin set.
      - name: Build for simulator (no signing)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
