name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck-lint-build:
    # Pinned, not ubuntu-latest: Capacitor CLI needs Node >=22 (fixed below),
    # and ubuntu-latest migrated to Ubuntu 26 on 2026-10-19, which broke
    # Playwright chromium installs in the e2e job (see BUG_REGISTER.md) —
    # pinning avoids the next silent OS-migration surprise too.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Lint (non-blocking — 72 pre-existing errors not from this change, see docs/qa/BUG_REGISTER.md)
        run: npm run lint || true
      - run: npm run build
      - run: npm test -- --run

  e2e:
    runs-on: ubuntu-24.04
    needs: typecheck-lint-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Uses channel: "chrome" in playwright.config.ts (GitHub's ubuntu runner
      # images ship Chrome stable preinstalled) instead of Playwright's own
      # managed chromium download, which doesn't support Ubuntu 26 yet.
      - run: npm run build
      - run: npx playwright test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
